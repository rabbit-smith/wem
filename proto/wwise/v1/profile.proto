// Encoder profile identification types for the WEM encoding contract.
syntax = "proto3";

// Versioned WEM encoding contract namespace.
package wwise.v1;

import "wwise/v1/common.proto";

// Key that selects an encoder profile by PCM geometry.
message ProfileKey {
  // Number of interleaved channels.
  uint32 channels = 1;

  // Sample rate in hertz.
  uint32 sample_rate = 2;

  // Reserved for future key fields.
  reserved 3 to 10;
}

// One installed encoder profile.
message ProfileInfo {
  // Stable profile name (for example "wwise2013-6ch-44100").
  string name = 1;

  // Wwise generation the profile was calibrated for (for example "2013.2").
  string wwise_generation = 2;

  // SHA-256 of the profile setup packet, lowercase hex, 64 characters.
  string setup_sha256 = 3;

  // SHA-256 of the profile manifest document, lowercase hex, 64 characters.
  string manifest_sha256 = 4;

  // PCM geometries this profile can encode.
  repeated PcmFormat supported_formats = 5;

  // Reserved for future profile fields.
  reserved 6 to 10;
}
