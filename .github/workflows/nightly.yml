name: nightly

# Heavy oracle-vs-kernel parity checks that do not belong in the PR path:
#   * random-PCM differential fuzz (oracle vs native, byte-exact) on a
#     fixed seed set sized for a < 30 minute budget;
#   * the deterministic 20-second 2ch music case across the native,
#     reference, and streaming paths;
#   * the release-build encode measurement, whose output is the run log's
#     numbers (min / median / p95 / spread plus the per-stage split), not a
#     verdict. There is no threshold and no recorded baseline: a shared
#     runner's clock cannot decide whether this code is correct, and a number
#     compared against a recorded one hides the change it reports.
on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  differential-parity-and-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: editable install (maturin builds the native kernel)
        run: python -m pip install -e ".[dev]"
      - name: nightly differential fuzz (oracle vs native, deterministic seeds)
        run: python scripts/fuzz_diff_parity.py --full
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      - name: long-form 2ch music case
        run: python -m unittest tests.parity.two_channel_long_run -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      - name: release build for the encode measurement
        # The CLI requires the opt-in `parallel` feature: a default build is
        # scalar (the library imposes no threads), and this job measures the
        # binary in the configuration that carries it.
        run: cd crates && cargo build --release -p wem-core --features parallel
      - name: encode measurement (numbers only; nothing here is red)
        run: python scripts/measure_encode_perf.py
      - name: the opt-in configuration's byte parity suites
        # The wheel and the C ABI are built scalar (the library default); this
        # step keeps the other configuration honest against the same oracle.
        # The suites resolve their own interpreter and PYTHONPATH.
        run: cd crates && cargo test -p wem-core --features parallel --test encoder --test frame_pipeline_parity
