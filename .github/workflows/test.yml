name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Type/lint tooling only. The package itself is NOT installed: its
      # build backend is maturin, and pip-installing it would pull a Rust
      # toolchain into a Python-only job.
      - run: python -m pip install "ruff>=0.6" "mypy>=1.11"
      - run: ruff check src reference tests scripts
      - run: mypy src reference

  regression:
    # Single execution path: the facade's byte-producing calls run on the
    # in-package native extension (wwise_wem._core, built from the
    # wem-python binding crate). Every cell builds that kernel and runs
    # the full suite against it as a hard gate — no native-absent skips.
    # The reference oracle (reference/) stays on PYTHONPATH as a test
    # asset for the parity and contract suites.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # dev extras without the package itself (the package imports from
      # PYTHONPATH; pip-installing it would run a second maturin build);
      # the kernel build goes through the maturin develop step below
      - run: python -m pip install "maturin>=1.7" "grpcio>=1.60" "grpcio-tools>=1.60"
      - name: in-package native kernel (maturin develop)
        run: maturin develop -F extension-module
      - name: full suite on the native kernel (hard gate)
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      - name: native binding smoke (streaming + one-shot, byte-exact)
        run: python scripts/native_smoke.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      - name: "wheel gate (single wheel: facade + native; clean-venv encode)"
        run: python scripts/wheel_smoke.py
      - name: differential parity PR gate (golden + 10 cases, < 1 minute)
        run: python scripts/fuzz_diff_parity.py --pr
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference

  server-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # gRPC client tooling only; the script resolves the package paths
      # itself via PYTHONPATH.
      - run: python -m pip install "grpcio>=1.60" "grpcio-tools>=1.60"
      - run: cd crates && cargo build --release -p wem-server
      - name: wwise.v1 interop smoke (Python client vs Rust wem-server)
        run: python scripts/interop_grpc_smoke.py --server-bin crates/target/release/wem-server
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      # --- Go reference client (examples/grpc-go) rot gate ---------------
      # Regenerates the gRPC stubs with the canonical recipe documented in
      # examples/grpc-go/README.md and examples/grpc-go/.gitignore, then
      # streams the fixture through wem-server and asserts the golden WEM
      # sha256. Plugin versions are pinned to the ones verified against
      # this repo's go.sum runtime; bump them deliberately.
      # go.mod declares `go 1.26` (released); setup-go resolves the latest
      # 1.26.x stable. If 1.26 were ever unavailable, use "stable" and
      # require the toolchain to satisfy go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install protoc + Go protoc plugins (pinned, verified)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@1.5.1
      - name: Regenerate Go gRPC stubs (canonical recipe; keep in sync with README/.gitignore)
        run: |
          set -euo pipefail
          PATH="$HOME/go/bin:$PATH" protoc -I proto \
            --go_out=examples/grpc-go --go_opt=paths=source_relative \
            --go_opt=Mwwise/v1/common.proto=grpc-go/wwise/v1 \
            --go_opt=Mwwise/v1/profile.proto=grpc-go/wwise/v1 \
            --go_opt=Mwwise/v1/encode.proto=grpc-go/wwise/v1 \
            --go-grpc_out=examples/grpc-go --go-grpc_opt=paths=source_relative \
            --go-grpc_opt=Mwwise/v1/common.proto=grpc-go/wwise/v1 \
            --go-grpc_opt=Mwwise/v1/profile.proto=grpc-go/wwise/v1 \
            --go-grpc_opt=Mwwise/v1/encode.proto=grpc-go/wwise/v1 \
            proto/wwise/v1/common.proto proto/wwise/v1/profile.proto proto/wwise/v1/encode.proto
      - name: go vet + build the reference client
        run: |
          set -euo pipefail
          cd examples/grpc-go
          go vet ./...
          go build ./...
      - name: Go end-to-end (stream fixture through wem-server, assert golden sha256)
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          ./crates/target/release/wem-server --addr 127.0.0.1:0 > "$LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          # Poll the server's READY line (its documented ready contract);
          # bounded wait on an ephemeral port, no fixed sleeps.
          READY_LINE=""
          for _ in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "wem-server exited early:"; cat "$LOG"; exit 1
            fi
            READY_LINE=$(grep -m1 '^READY ' "$LOG" || true)
            if [ -n "$READY_LINE" ]; then break; fi
            sleep 1
          done
          if [ -z "$READY_LINE" ]; then
            echo "wem-server did not become ready within 30s:"; cat "$LOG"; exit 1
          fi
          ADDR="${READY_LINE#READY }"
          echo "wem-server ready at $ADDR"
          cd examples/grpc-go
          go run . -addr "$ADDR" -wav ../../tests/fixtures/input.wav -out /tmp/go-ref-out.wem
          GOT=$(sha256sum /tmp/go-ref-out.wem | awk '{print $1}')
          if [ "$GOT" != "17851d26c6210b85e498ae0452d2562d7b9e2c3e9e795c459656b9c9d8d35247" ]; then
            echo "golden sha256 mismatch: got $GOT"; exit 1
          fi
          echo "golden sha256 OK: $GOT"
