name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Type/lint tooling only. The package itself is NOT installed: its
      # build backend is maturin, and pip-installing it would pull a Rust
      # toolchain into a Python-only job.
      - run: python -m pip install "ruff>=0.6" "mypy>=1.11"
      - run: ruff check src reference tests scripts
      - run: mypy src reference

  regression:
    # Single execution path: the facade's byte-producing calls run on the
    # in-package native extension (wwise_wem._core, built from the
    # wem-python binding crate). Every cell builds that kernel and runs
    # the full suite against it as a hard gate — no native-absent skips.
    # The reference oracle (reference/) stays on PYTHONPATH as a test
    # asset for the parity and contract suites.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # dev extras without the package itself (the package imports from
      # PYTHONPATH; pip-installing it would run a second maturin build);
      # the kernel build goes through the maturin develop step below
      - run: python -m pip install "maturin>=1.7"
      - name: in-package native kernel (maturin build + drop extension into src)
        shell: bash
        run: |
          set -euo pipefail
          maturin build --release -o native-wheel
          python - <<'PY'
          import glob, pathlib, zipfile
          wheel = sorted(glob.glob("native-wheel/*.whl"))[-1]
          with zipfile.ZipFile(wheel) as z:
              members = [
                  n
                  for n in z.namelist()
                  if n.startswith("wwise_wem/_core.")
                  and n.rsplit(".", 1)[-1] in ("so", "pyd", "dylib")
              ]
              assert members, f"no _core extension in {wheel}"
              for m in members:
                  target = pathlib.Path("src") / m
                  target.write_bytes(z.read(m))
                  print("installed", target)
          PY
        env:
          CARGO_TERM_COLOR: always
      - name: full suite on the native kernel (hard gate)
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      - name: native binding smoke (streaming + one-shot, byte-exact)
        run: python scripts/native_smoke.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference
      - name: "wheel gate (single wheel: facade + native; clean-venv encode)"
        run: python scripts/wheel_smoke.py
      - name: differential parity PR gate (golden + 10 cases, < 1 minute)
        run: python scripts/fuzz_diff_parity.py --pr
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/reference

  capi:
    # C ABI core surface (the single cross-language integration point):
    # proves byte-exactness end-to-end — the Rust FFI tests (capi_e2e)
    # plus the Go cgo reference binding streaming the fixture through
    # the C ABI and rebuilding the golden WEM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd crates && cargo build --release -p wem-capi
      - run: cd crates && cargo test --release -p wem-capi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build + run the Go cgo reference binding (byte-exact)
        run: |
          set -euo pipefail
          cd examples/go-cgo
          go vet ./...
          go build ./...
          go run . -wav ../../tests/fixtures/input.wav -out "${RUNNER_TEMP}/go-capi-out.wem"
          GOT=$(sha256sum "${RUNNER_TEMP}/go-capi-out.wem" | awk '{print $1}')
          if [ "$GOT" != "17851d26c6210b85e498ae0452d2562d7b9e2c3e9e795c459656b9c9d8d35247" ]; then
            echo "golden sha256 mismatch: got $GOT"; exit 1
          fi
          echo "golden sha256 OK: $GOT"

