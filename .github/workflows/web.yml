name: web

on:
  push:
  pull_request:

jobs:
  web:
    # Browser encoding shell: proves the wasm build compiles for
    # wasm32-unknown-unknown and that the Node-side parity test passes —
    # fixture PCM through the wasm package must reproduce the kernel
    # reference sha256, one-shot and across chunkings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: wasm-pack/wasm-pack-action@v0.4.0
      - name: wasm32 check (threadless kernel + wasm shell)
        run: cd crates && cargo check -p wem-wasm --target wasm32-unknown-unknown
      - name: clippy (wasm target)
        run: cd crates && cargo clippy -p wem-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: unit tests (native; error-code table)
        run: cd crates && cargo test -p wem-wasm
      - name: build nodejs target (for the parity test)
        # Absolute out-dir: wasm-pack resolves --out-dir against the CRATE
        # directory, not the current one, so a relative path here lands in
        # crates/js/ and the parity test below would then validate the
        # committed artifacts instead of the freshly built kernel.
        run: cd crates && wasm-pack build wem-wasm --target nodejs --release --out-dir "$(pwd)/../js/pkg-node"
      - name: build web target (npm/browser artifact)
        run: cd crates && wasm-pack build wem-wasm --target web --release --out-dir "$(pwd)/../js/pkg"
      - name: node parity test (reference sha256 + chunking consistency + error codes)
        run: node js/test-node.mjs
