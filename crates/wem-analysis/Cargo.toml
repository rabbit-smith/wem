[package]
name = "wem-analysis"
description = "WEM encoder analysis domain: typed resource models and DSP primitives (resource-free)."
version.workspace = true
edition.workspace = true

[features]
default = ["parallel"]
# Per-channel rayon partitioning inside a single analysis call (see
# pipeline.rs). Safe: each channel reads only its own input slice plus
# immutable shared looks; no cross-channel shared mutable state, and
# cross-frame state updates stay strictly sequential. Bit-exact parity is
# backed by the golden_e2e / stage_frames / vorbis_golden tests.
#
# Disabled on threadless targets (e.g. wasm32-unknown-unknown): there rayon
# cannot spawn its pool, so the scalar path (the `parallel`-free branch in
# pipeline.rs) is used. Turn it off there via `default-features = false` or
# `features = []`.
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
wem-scheduling = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
wem-profiles = { workspace = true }
