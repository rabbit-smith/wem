[package]
name = "wem-analysis"
description = "WEM encoder analysis domain: typed resource models and DSP primitives (resource-free)."
version.workspace = true
edition.workspace = true

[features]
# Per-channel rayon partitioning inside a single long-frame analysis call
# (see pipeline.rs). NOT a default feature: a consumer opts in explicitly — the
# top-level orchestration crate (wem-core) forwards its own non-default
# `parallel`, and our CLI requires it — so a library build, a wheel and a
# threadless target (e.g. wasm32-unknown-unknown) all stay pure-scalar unless
# asked. Safe: each channel reads only its own slice + immutable looks;
# cross-frame state updates stay strictly sequential. Bit-exact parity is backed
# by the encoder / frame_pipeline_parity / vorbis_codec tests.
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
wem-scheduling = { workspace = true }
