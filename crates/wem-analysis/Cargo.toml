[package]
name = "wem-analysis"
description = "WEM encoder analysis domain: typed resource models and DSP primitives (resource-free)."
version.workspace = true
edition.workspace = true

[features]
# Per-channel rayon partitioning inside a single long-frame analysis call
# (see pipeline.rs). NOT a default feature: it is enabled by the top-level
# orchestration crate (wem-core) so native builds get it by default, while a
# threadless target (e.g. wasm32-unknown-unknown) stays pure-scalar unless a
# consumer explicitly opts in. Safe: each channel reads only its own slice +
# immutable looks; cross-frame state updates stay strictly sequential. Bit-
# exact parity is backed by the encoder / frame_pipeline_parity /
# vorbis_codec tests.
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
wem-scheduling = { workspace = true }
