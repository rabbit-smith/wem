[package]
name = "wem-wasm"
description = "wasm-bindgen shell over the WEM encoder kernel (browser/web encoding)."
version.workspace = true
edition.workspace = true
license.workspace = true

# cdylib: the crate type wasm-bindgen / wasm-pack emit from; there is no
# native use for this shell (the C ABI and PyO3 shells cover native).
[lib]
crate-type = ["cdylib"]

[dependencies]
# The kernel, threadless: `default-features = false` states it here rather than
# relying on the default alone, so wasm32-unknown-unknown keeps building the
# pure-scalar analysis path if a default ever moves (see the workspace comments
# and wem-analysis). Zero kernel changes for this shell.
# Direct path dependency (like wem-python): a workspace dependency would not
# let this crate disable wem-core's default features (cargo warning).
wem-core = { path = "../wem-core", default-features = false }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
