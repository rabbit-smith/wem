# NOTE: the repository-root pyproject.toml is the canonical distribution
# configuration (maturin backend, single wheel: facade + native extension).
# This file documents the binding crate's own build inputs; a wheel built
# from this manifest alone would ship the extension without the facade
# package and is NOT the distribution path.

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "wwise-wem-native"
version = "0.1.0"
description = "Native (abi3) extension binding for the wem-core WEM encoder kernel"
requires-python = ">=3.10"
dependencies = []

[tool.maturin]
# In-package module: the extension is imported as `wwise_wem._core`
# (installed as `wwise_wem/_core.abi3.so` by the root pyproject's
# module-name setting).
module-name = "wwise_wem._core"

# Build/install commands (the `extension-module` feature must be active so
# the .so borrows host-interpreter symbols instead of linking libpython;
# it is intentionally NOT a default because `cargo test` needs the opposite):
#   maturin develop -F extension-module   (into the active venv)
#   maturin build   -F extension-module   (abi3 wheel, cp310-abi3)
