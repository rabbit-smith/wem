# Rust workspace for the bit-exact WEM encoder kernel.
#
# Dependency direction (locked by docs/architecture.md):
#   wem-scheduling        - no sibling dependencies (pure plans/policies)
#   wem-analysis          - depends on wem-scheduling; resource-free typed models + DSP
#   wem-vorbis            - depends on wem-analysis; bitstream/codebook/setup primitives
#   wem-container         - no sibling dependencies; RIFF/WEM models
#   wem-profiles          - depends on wem-analysis + wem-vorbis; sole owner of packaged
#                           calibration resources, checksum verification, table loaders
#   wem-core              - depends on everything; the only orchestration layer
[workspace]
resolver = "2"
members = [
    "wem-profiles",
    "wem-scheduling",
    "wem-analysis",
    "wem-vorbis",
    "wem-container",
    "wem-core",
    "wem-python",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["wem"]

[workspace.dependencies]
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Rayon is optional and used ONLY by wem-analysis behind its default-on
# `parallel` feature: per-channel partitioning inside a single long-frame
# analysis call, never across frames (cross-frame state updates stay strictly
# sequential, and each channel reads only its own slice + immutable looks).
# Bit-exact parity is backed by the golden_e2e / stage_frames / vorbis_golden
# tests. It is feature-gated so threadless targets (e.g. wasm32-unknown-
# unknown) can build a pure-scalar path via `default-features = false`.
rayon = "1.10.0"

wem-scheduling = { path = "wem-scheduling" }
wem-analysis = { path = "wem-analysis" }
wem-vorbis = { path = "wem-vorbis" }
wem-container = { path = "wem-container" }
wem-profiles = { path = "wem-profiles" }
