# wem-capi — the C ABI core surface: the single cross-language integration
# point of the WEM encoder kernel.
#
# include/wem.h (repo root) is the interface this crate mirrors: lifecycle,
# reply framing, error codes, memory ownership, integration rules. This crate
# implements that header 1:1 and funnels every call into wem-core; it owns
# no numerics, no profile logic, no second behavior. See crates/AGENTS.md,
# "C ABI surface".

[package]
name = "wem-capi"
description = "C ABI core surface for the WEM encoder kernel (include/wem.h)."
version.workspace = true
edition.workspace = true
license.workspace = true

# cdylib: dynamic library for Go cgo / C consumers;
# staticlib: static archive for embedded builds;
# rlib: in-workspace integration tests (tests/capi_surface.rs) link it as Rust.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Default features: like the wheel, this is a library loaded into a host
# application's process, and a host that links a prebuilt archive cannot change
# a compile-time feature — so it takes the scalar configuration and imposes no
# threads (docs/reference/standards.md, "Portability floor").
wem-core = { workspace = true }
wem-profiles = { workspace = true }

[dev-dependencies]
wem-container = { workspace = true }
