[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "wwise-wem"
version = "0.1.0"
description = "Bit-exact Wwise Vorbis WAV-to-WEM encoder"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Wwise WEM Encoder Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
wwise-wem = "wwise_wem.cli:main"

# Single-wheel distribution: `pip install .` (or `pip wheel .`) builds the
# abi3 extension from the wem-python binding crate and ships it inside the
# `wwise_wem` package next to the pure-Python facade, so one wheel carries
# both the facade and its native engine. Pure-Python sources and profile
# data are picked up from `python-source`; the Rust workspace root stays
# `crates/Cargo.toml` (maturin points at the child manifest, no second
# workspace).
[tool.maturin]
python-source = "src"
manifest-path = "crates/wem-python/Cargo.toml"
module-name = "wwise_wem._core"
# extension-module: the .so borrows host-interpreter symbols (no libpython
# in the wheel); see crates/wem-python/Cargo.toml for the full rationale.
features = ["extension-module"]
# Development guide must not ship inside the distribution.
exclude = ["src/wwise_wem/AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: complete bit-exact fixture encoding"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Conservative rule set: correctness-focused, no reformatting churn.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src:reference"
# Baseline gate: type-check without forcing full annotation coverage.
# Tighten (disallow_untyped_defs etc.) as a dedicated change.
check_untyped_defs = true
ignore_missing_imports = true

